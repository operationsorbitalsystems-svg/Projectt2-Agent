name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ── Mistral ───────────────────────────────────────────────────────
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # ── App ───────────────────────────────────────────────────────────
          DEBUG: ${{ secrets.DEBUG }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          # ── Logging ───────────────────────────────────────────────────────
          LOG_CLOUDWATCH_ENABLED: ${{ secrets.LOG_CLOUDWATCH_ENABLED }}
          LOG_FILE_ENABLED: ${{ secrets.LOG_FILE_ENABLED }}
          CW_LOG_GROUP: ${{ secrets.CW_LOG_GROUP }}
          # ── AWS / Bedrock ─────────────────────────────────────────────────
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRETE_KEY: ${{ secrets.AWS_SECRETE_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          # ── Langfuse ──────────────────────────────────────────────────────
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          # ── Redis ─────────────────────────────────────────────────────────
          REDIS_ENABLED: ${{ secrets.REDIS_ENABLED }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_SSL: ${{ secrets.REDIS_SSL }}
          REDIS_SSL_VERIFY: ${{ secrets.REDIS_SSL_VERIFY }}
          # ── COA ───────────────────────────────────────────────────────────
          # COA_JSON_PATH: ${{ secrets.COA_JSON_PATH }}
        
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: MISTRAL_API_KEY,DEBUG,ENVIRONMENT,SERVICE_NAME,LOG_CLOUDWATCH_ENABLED,LOG_FILE_ENABLED,CW_LOG_GROUP,AWS_DEFAULT_REGION,AWS_ACCESS_KEY,AWS_SECRETE_KEY,BEDROCK_MODEL_ID,LANGFUSE_SECRET_KEY,LANGFUSE_PUBLIC_KEY,LANGFUSE_BASE_URL,REDIS_ENABLED,REDIS_URL,REDIS_SSL,REDIS_SSL_VERIFY,COA_JSON_PATH
          script: |
            set -e

            # ── 1. Clone or pull ──────────────────────────────

            if [ ! -d /opt/backend/.git ]; then
              echo "Fresh clone..."
              sudo rm -rf /opt/backend
              sudo mkdir -p /opt/backend
              sudo chown ubuntu:ubuntu /opt/backend
              git clone -b prod git@github.com:operationsorbitalsystems-svg/Projectt2-Agent.git /opt/backend
            else
              echo "Updating existing repo..."
              cd /opt/backend
              git fetch origin
              git reset --hard origin/prod
            fi

            cd /opt/backend
            git fetch origin
            git reset --hard origin/prod

            # ── 2. Virtual environment ────────────────────────────────────────
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi

            # ── 3. Install / update dependencies ─────────────────────────────
            venv/bin/pip install --upgrade pip --quiet
            venv/bin/pip install -r requirements.txt --quiet

            # ── 4. Write .env from secrets ────────────────────────────────────
            {
              echo "MISTRAL_API_KEY=${MISTRAL_API_KEY}"
              echo "DEBUG=${DEBUG}"
              echo "ENVIRONMENT=${ENVIRONMENT}"
              echo "SERVICE_NAME=${SERVICE_NAME}"
              echo "LOG_CLOUDWATCH_ENABLED=${LOG_CLOUDWATCH_ENABLED}"
              echo "LOG_FILE_ENABLED=${LOG_FILE_ENABLED}"
              echo "CW_LOG_GROUP=${CW_LOG_GROUP}"
              echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
              echo "AWS_ACCESS_KEY=${AWS_ACCESS_KEY}"
              echo "AWS_SECRETE_KEY=${AWS_SECRETE_KEY}"
              echo "BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}"
              echo "LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}"
              echo "LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}"
              echo "LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}"
              echo "REDIS_ENABLED=${REDIS_ENABLED}"
              echo "REDIS_URL=${REDIS_URL}"
              echo "REDIS_SSL=${REDIS_SSL}"
              echo "REDIS_SSL_VERIFY=${REDIS_SSL_VERIFY}"
              echo "COA_JSON_PATH=${COA_JSON_PATH}"
            } > /opt/backend/.env
            chmod 600 /opt/backend/.env

            # ── 5. Create systemd service (first deploy only) ─────────────────
            if [ ! -f /etc/systemd/system/backend.service ]; then
              sudo tee /etc/systemd/system/backend.service > /dev/null << 'SERVICEEOF'
            [Unit]
            Description=Backend FastAPI Service
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=/opt/backend
            EnvironmentFile=/opt/backend/.env
            ExecStart=/opt/backend/venv/bin/gunicorn \
                -k uvicorn.workers.UvicornWorker \
                server:app \
                --workers 1 \
                --bind 0.0.0.0:8000
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICEEOF
            fi

            # ── 6. Reload daemon and restart service ──────────────────────────
            sudo systemctl daemon-reload
            sudo systemctl enable backend
            sudo systemctl restart backend

            # ── 7. Health check ───────────────────────────────────────────────
            sleep 5
            sudo systemctl is-active --quiet backend && echo "Service is running" || (echo "Service failed to start" && sudo journalctl -u backend --no-pager -n 30 && exit 1)